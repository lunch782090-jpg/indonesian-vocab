<style>
:root{--bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;--border:#2a2a35;--accent:#e8772e;--text:#f0ede8;--muted:#8a8799;--green:#27ae60;--red:#c0392b;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:linear-gradient(135deg,#3a1a08,#0d0d0f 70%);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.back{color:var(--muted);font-size:.8rem;text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:8px;flex-shrink:0;}
.logo{font-family:'Playfair Display','Noto Sans JP',serif;font-size:1.3rem;color:var(--accent);flex:1;line-height:1.2;}
.logo span{display:block;color:var(--text);font-size:.78rem;font-weight:400;font-family:'DM Sans',sans-serif;}
.stats{display:flex;gap:14px;}
.stat{text-align:center}.stat b{display:block;font-size:1.1rem;color:var(--accent)}.stat small{font-size:.6rem;color:var(--muted)}
.controls{padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border);}
.controls input{flex:1;min-width:160px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:.9rem;outline:none;}
.controls input:focus{border-color:var(--accent);}
select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:.85rem;}
.btn{padding:10px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:.85rem;font-weight:500;background:transparent;color:var(--muted);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.cats{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border);}
.cat{padding:6px 13px;border-radius:20px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);}
.cat.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.main{display:flex;height:calc(100vh - 190px);min-height:420px;}
.list{width:340px;min-width:280px;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.item:hover{background:var(--surface2);}
.item.active{background:rgba(232,119,46,.12);border-left:3px solid var(--accent);}
.num{font-size:.7rem;color:var(--muted);min-width:30px;text-align:right;}
.wm{flex:1;min-width:0;}
.w{font-size:1.05rem;font-weight:600;font-family:'Noto Sans JP',sans-serif;}
.wr{font-size:.75rem;color:var(--accent);}
.wz{font-size:.76rem;color:var(--muted);margin-top:1px;}
.pos{font-size:.62rem;padding:2px 7px;border-radius:10px;border:1px solid rgba(232,119,46,.35);color:var(--accent);white-space:nowrap;}
.play-mini{width:30px;height:30px;border-radius:50%;background:rgba(232,119,46,.15);border:1px solid rgba(232,119,46,.35);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:.7rem;flex-shrink:0;}
.detail{flex:1;overflow-y:auto;padding:28px 30px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:10px;text-align:center;}
.dw{font-family:'Noto Sans JP',sans-serif;font-size:3rem;line-height:1.1;}
.dr{font-size:1.1rem;color:var(--accent);margin:6px 0 2px;}
.dh{font-size:.95rem;color:#ccc;margin-bottom:14px;letter-spacing:1px;}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tag{padding:4px 12px;border-radius:20px;font-size:.76rem;border:1px solid var(--border);color:var(--muted);}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.abtn{padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:.85rem;}
.abtn.main1{background:var(--accent);border-color:var(--accent);color:#fff;}
.st{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:18px 0 10px;}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;font-size:1.1rem;}
.ex{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.ex-ja{font-family:'Noto Sans JP',sans-serif;font-size:1.05rem;line-height:1.5;}
.ex-kana{font-size:.8rem;color:var(--accent);margin-top:4px;}
.ex-zhy{font-size:.8rem;color:#bbb;margin-top:2px;letter-spacing:.5px;}
.ex-zh{font-size:.88rem;color:#aaa;margin:6px 0 8px;}
.ex-audio{display:inline-block;padding:5px 12px;border-radius:6px;background:rgba(232,119,46,.1);border:1px solid rgba(232,119,46,.3);color:var(--accent);font-size:.75rem;cursor:pointer;}
.rel{display:flex;gap:8px;flex-wrap:wrap;}
.rel span{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:.82rem;}
.pager{padding:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--border);}
.pg{padding:6px 11px;border-radius:6px;font-size:.8rem;background:var(--surface2);color:var(--muted);border:1px solid var(--border);cursor:pointer;}
.pg.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 22px;max-width:480px;width:92%;max-height:92vh;overflow-y:auto;}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:10px;}
.bar{background:var(--border);height:4px;border-radius:4px;margin-bottom:16px;}
.bar div{background:var(--accent);height:4px;border-radius:4px;width:0;transition:width .3s;}
.qw{font-family:'Noto Sans JP',sans-serif;font-size:2.4rem;text-align:center;color:var(--accent);cursor:pointer;}
.qr{text-align:center;color:#ccc;font-size:.9rem;margin:4px 0;}
.qh{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:10px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.opt{padding:13px 8px;border-radius:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);cursor:pointer;font-size:.88rem;}
.opt.correct{background:rgba(39,174,96,.2);border-color:var(--green);color:var(--green);}
.opt.wrong{background:rgba(192,57,43,.2);border-color:var(--red);color:var(--red);}
.score{text-align:center;color:var(--muted);font-size:.82rem;margin-top:12px;}
.rbtn{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:.9rem;margin-top:10px;}
.rbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.wrongrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-radius:8px;margin-bottom:6px;border-left:3px solid var(--red);font-size:.88rem;}
@media(max-width:768px){.main{flex-direction:column;height:auto;}.list{width:100%;height:46vh;min-width:0;}.detail{padding:18px 14px;}.dw{font-size:2.3rem;}.stats{display:none;}}

<header>
  <a class="back" href="index.html">‹ 返回</a>
  <div class="logo">🇪🇸 西班牙語高頻單字<span>Vocabulario frecuente</span></div>
  <div class="stats">
    <div class="stat"><b id="totalCount">0</b><small>單字數</small></div>
    <div class="stat"><b id="learnedCount">0</b><small>已學習</small></div>
  </div>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="🔍 搜尋單字、中文…">
  <select id="posFilter">
    <option value="">所有詞性</option>
    <option value="n.m.">陽性名詞</option>
    <option value="n.f.">陰性名詞</option>
    <option value="n.prop.">專有名詞</option>
    <option value="v.">動詞</option>
    <option value="adj.">形容詞</option>
    <option value="adv.">副詞</option>
    <option value="pron.">代名詞</option>
    <option value="prep.">介系詞</option>
    <option value="conj.">連接詞</option>
    <option value="num.">數詞</option>
    <option value="phr.">慣用語</option>
  </select>
  <select id="levelFilter">
    <option value="">所有等級</option>
    <option value="1">基礎</option>
    <option value="2">初級</option>
    <option value="3">中級</option>
  </select>
  <button class="btn primary" onclick="openQuiz()">📝 測驗模式</button>
  <button class="btn" onclick="playPage()">🔊 全部播放</button>
  <button class="btn" onclick="voiceCheck()">🎙️ 語音診斷</button>
</div>
<div class="cats" id="cats"></div>

<div class="main">
  <div class="list" id="list"></div>
  <div class="detail" id="detail">
    <div class="empty"><div style="font-size:3rem">🇪🇸</div><div style="font-size:1.1rem;color:var(--text)">選擇單字開始學習</div><div>點擊單字查看中文諧音、例句與音檔</div></div>
  </div>
</div>
<div class="pager" id="pager"></div>

<div class="overlay" id="quizOverlay">
  <div class="qcard" id="quizQ">
    <div class="qtop"><span id="qRound">第 1 輪</span><span id="qProg">1 / 20</span><span style="cursor:pointer" onclick="closeQuiz()">✕ 離開</span></div>
    <div class="bar"><div id="qBar"></div></div>
    <div class="qh">這個單字的中文意思是？</div>
    <div class="qw" id="qWord" onclick="quizSpeak()"></div>
    <div class="qr" id="qRead"></div>
    <div class="qh" id="qZh"></div>
    <button class="abtn" style="display:block;margin:0 auto" onclick="quizSpeak()">🔊 播放發音</button>
    <div class="opts" id="qOpts"></div>
    <div class="score" id="qScore"></div>
  </div>
  <div class="qcard" id="quizR" style="display:none;text-align:center">
    <div style="font-size:2.4rem" id="rEmoji">🎉</div>
    <div style="font-size:1.4rem;color:var(--accent);margin:6px 0" id="rTitle"></div>
    <div style="display:flex;justify-content:center;gap:26px;margin:14px 0">
      <div><b style="font-size:1.8rem;color:var(--green)" id="rOk">0</b><br><small style="color:var(--muted)">答對</small></div>
      <div><b style="font-size:1.8rem;color:var(--red)" id="rNg">0</b><br><small style="color:var(--muted)">答錯</small></div>
      <div><b style="font-size:1.8rem;color:var(--accent)" id="rPct">0%</b><br><small style="color:var(--muted)">正確率</small></div>
    </div>
    <div id="rWrong" style="text-align:left;max-height:170px;overflow-y:auto"></div>
    <button class="rbtn primary" id="rRetry" onclick="retryWrong()">🔁 重考答錯的單字</button>
    <button class="rbtn" onclick="newQuiz()">🎲 再來 20 題</button>
    <button class="rbtn" onclick="closeQuiz()">✕ 離開測驗</button>
  </div>
</div>

const CV={b:'巴貝比波布',k:'卡凱奇科庫',d:'達德迪多杜',f:'法費菲佛福',g:'嘎給吉哥古',j:'哈黑希霍胡',l:'拉勒里洛盧',m:'瑪梅米莫木',n:'那內尼諾努',p:'帕佩皮波普',r:'拉雷里羅魯',R:'啦累哩囉嚕',s:'薩塞西索蘇',t:'塔特提托圖',y:'亞耶伊優尤',c:'恰切奇喬丘',w:'瓦威威沃烏'};
const NARR=['尼亞','尼耶','尼','尼歐','尼烏'];
const CODA={b:'布',k:'克',d:'德',f:'夫',g:'格',j:'赫',l:'爾',m:'姆',n:'恩',N:'尼',p:'普',r:'爾',R:'爾',s:'斯',t:'特',y:'伊',c:'奇',w:'烏'};
const VOW={a:'阿',e:'欸',i:'伊',o:'歐',u:'烏'};
const YG={a:'亞',e:'耶',i:'伊',o:'優',u:'尤'};
const WG={a:'瓦',e:'威',i:'伊',o:'沃',u:'烏'};
function wordToZh(w){
  w=w.toLowerCase().replace(/ü/g,'U').replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u');
  const isV=function(c){return c&&'aeiouU'.indexOf(c)>=0;};
  const t=[];
  for(let i=0;i<w.length;){
    const c=w[i],n=w[i+1]||'',n2=w[i+2]||'';
    if(isV(c)){t.push({v:c==='U'?'u':c});i++;continue;}
    if(c==='c'&&n==='h'){t.push({c:'c'});i+=2;continue;}
    if(c==='l'&&n==='l'){t.push({c:'y'});i+=2;continue;}
    if(c==='r'&&n==='r'){t.push({c:'R'});i+=2;continue;}
    if(c==='q'&&n==='u'){t.push({c:'k'});i+=2;continue;}
    if(c==='g'&&n==='u'&&'ei'.indexOf(n2)>=0&&n2){t.push({c:'g'});i+=2;continue;}
    if(c==='g'&&n&&'ei'.indexOf(n)>=0){t.push({c:'j'});i++;continue;}
    if(c==='c'&&n&&'ei'.indexOf(n)>=0){t.push({c:'s'});i++;continue;}
    if(c==='c'||c==='k'||c==='q'){t.push({c:'k'});i++;continue;}
    if(c==='z'){t.push({c:'s'});i++;continue;}
    if(c==='v'){t.push({c:'b'});i++;continue;}
    if(c==='h'){i++;continue;}
    if(c==='x'){t.push({c:'k'});t.push({c:'s'});i++;continue;}
    if(c==='y'){if(isV(n))t.push({c:'y'});else t.push({v:'i'});i++;continue;}
    if(c==='ñ'){t.push({c:'N'});i++;continue;}
    if('bdfgjlmnprstw'.indexOf(c)>=0){t.push({c:c});i++;continue;}
    i++;
  }
  let out='',prevV=null;
  for(let k=0;k<t.length;k++){
    const x=t[k];
    if(x.v){
      let ch;
      if(prevV==='i'&&'aeou'.indexOf(x.v)>=0)ch=YG[x.v];
      else if(prevV==='u'&&'aeio'.indexOf(x.v)>=0)ch=WG[x.v];
      else ch=VOW[x.v];
      out+=ch;prevV=x.v;continue;
    }
    const nx=t[k+1];
    if(nx&&nx.v){
      const vi='aeiou'.indexOf(nx.v);
      out+=(x.c==='N')?NARR[vi]:CV[x.c][vi];
      prevV=nx.v;k++;continue;
    }
    out+=CODA[x.c];prevV=null;
  }
  return out;
}
function toZh(s){
  return s.replace(/[¿¡?!.,;:«»"“”()\u2014\u2013]/g,' ').split(/\s+/).filter(function(x){return x&&!/^[\d-]+$/.test(x);}).map(wordToZh).join(' ');
}

  if(!window.speechSynthesis)return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(function(v){return v.lang==='es-MX';})||vs.find(function(v){return v.lang==='es-US';})||vs.find(function(v){return v.lang==='es-ES';})||vs.find(function(v){return v.lang.toLowerCase().indexOf('es')===0;})||null;
}
function speak(text,done){
  if(!window.speechSynthesis||!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=getEsVoice();
  u.lang=v?v.lang:'es-ES';u.rate=0.85;
  if(v)u.voice=v;
  if(done)u.onend=done;
  speechSynthesis.speak(u);
}
function speakId(id){const w=allWords[id-1];if(w)speak(w.word);}
function voiceCheck(){
  const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  const es=vs.filter(function(v){return v.lang.toLowerCase().indexOf('es')===0;});
  if(es.length){alert('找到 '+es.length+' 個西班牙語語音：\n'+es.map(function(v){return v.name+' ('+v.lang+')';}).join('\n'));}
  else{alert('找不到西班牙語語音。\n\nAndroid：設定 → 一般管理 → 文字轉語音（TTS）→ 下載西班牙語語音資料。\n未安裝時會用預設語音，發音可能不準。');}
  speak('Hola, ¿cómo estás?');
}
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices();};}

/* ================== 列表 / 篩選 ================== */
const PAGE=50;
let filtered=allWords.slice(),page=1,curCat='all',cur=null,curSents=[];
function buildCats(){
  const el=document.getElementById('cats');
  el.innerHTML=['all'].concat(CATS).map(function(c){return '<button class="cat'+(c==='all'?' active':'')+'" data-cat="'+c+'">'+(c==='all'?'全部':c)+'</button>';}).join('');
  el.onclick=function(e){
    const b=e.target.closest('.cat');if(!b)return;
    curCat=b.getAttribute('data-cat');
    el.querySelectorAll('.cat').forEach(function(x){x.classList.toggle('active',x===b);});
    applyFilters();
  };
}
function applyFilters(){
  const q=norm(document.getElementById('search').value.trim());
  const pos=document.getElementById('posFilter').value;
  const lv=document.getElementById('levelFilter').value;
  filtered=allWords.filter(function(w){
    if(curCat!=='all'&&w.cat!==curCat)return false;
    if(pos&&w.pos!==pos)return false;
    if(lv&&String(w.rank)!==lv)return false;
    if(q&&norm(w.word).indexOf(q)<0&&w.zh.indexOf(q)<0)return false;
    return true;
  });
  page=1;renderList();
}
function renderList(){
  const list=document.getElementById('list');
  const vis=filtered.slice((page-1)*PAGE,page*PAGE);
  list.innerHTML=vis.map(function(w){
    return '<div class="item'+(cur&&cur.id===w.id?' active':'')+'" data-id="'+w.id+'">'+
      '<div class="num">#'+w.id+'</div>'+
      '<div class="wm"><div class="w">'+w.word+'</div><div class="wz">'+w.zh+' <span style="color:#777">'+toZh(w.word)+'</span></div></div>'+
      '<div class="pos">'+w.pos+'</div>'+
      '<div class="play-mini" data-play="'+w.id+'">▶</div></div>';
  }).join('')||'<div style="padding:20px;color:var(--muted);text-align:center">沒有符合的單字</div>';
  document.getElementById('totalCount').textContent=filtered.length;
  renderPager();
}
document.getElementById('list').addEventListener('click',function(e){
  const p=e.target.closest('.play-mini');
  if(p){e.stopPropagation();speakId(parseInt(p.getAttribute('data-play'),10));return;}
  const it=e.target.closest('.item');
  if(it)selectWord(parseInt(it.getAttribute('data-id'),10));
});
function renderPager(){
  const total=Math.ceil(filtered.length/PAGE),el=document.getElementById('pager');
  if(total<=1){el.innerHTML='';return;}
  const show=[];
  for(let i=1;i<=total;i++){if(i===1||i===total||Math.abs(i-page)<=2)show.push(i);}
  let h='',last=0;
  show.forEach(function(i){
    if(i-last>1)h+='<span style="color:var(--muted);padding:0 2px">…</span>';
    h+='<button class="pg'+(i===page?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';
    last=i;
  });
  el.innerHTML=h;
}
function goPage(p){page=p;renderList();document.getElementById('list').scrollTop=0;}
function playPage(){
  const vis=filtered.slice((page-1)*PAGE,page*PAGE);let i=0;
  (function next(){if(i>=vis.length)return;const w=vis[i++];speak(w.word,function(){setTimeout(next,350);});})();
}

/* ================== 詳細頁 ================== */
function selectWord(id){
  cur=allWords[id-1];if(!cur)return;
  cur._learned=true;
  document.getElementById('learnedCount').textContent=allWords.filter(function(w){return w._learned;}).length;
  curSents=getSentences(cur);
  const w=cur;
  const ap=artPhrase(w);
  const rel=allWords.filter(function(r){return r.cat===w.cat&&r.id!==w.id;}).slice(0,8);
  document.getElementById('detail').innerHTML=
    '<div class="dw">'+w.word+'</div>'+
    (ap?'<div class="dr">'+ap+'</div>':'')+
    '<div class="dh">中文諧音：'+toZh(w.word)+'</div>'+
    '<div class="tags"><span class="tag">'+w.pos+'</span><span class="tag">#'+w.id+'</span><span class="tag">'+LEVELZH[w.rank]+'</span><span class="tag">'+w.cat+'</span></div>'+
    '<div class="row"><button class="abtn main1" onclick="speakId('+w.id+')">🔊 播放單字</button><button class="abtn" onclick="speakSent(0)">🔊 播放例句</button></div>'+
    '<div class="st">中文釋義</div><div class="box">'+w.zh+'</div>'+
    '<div class="st">例句 Ejemplos</div>'+
    curSents.map(function(s,i){
      return '<div class="ex"><div class="ex-ja">'+s.es+'</div><div class="ex-zhy">'+toZh(s.es)+'</div><div class="ex-zh">'+s.zh+'</div><span class="ex-audio" onclick="speakSent('+i+')">▶ 播放例句 '+(i+1)+'</span></div>';
    }).join('')+
    '<div class="st">相關單字</div><div class="rel">'+rel.map(function(r){return '<span data-rel="'+r.id+'">'+r.word+' '+firstZh(r.zh)+'</span>';}).join('')+'</div>';
  document.querySelectorAll('.rel span').forEach(function(s){s.onclick=function(){selectWord(parseInt(s.getAttribute('data-rel'),10));};});
  document.querySelectorAll('.item').forEach(function(x){x.classList.toggle('active',parseInt(x.getAttribute('data-id'),10)===id);});
  document.getElementById('detail').scrollTop=0;
}
function speakSent(i){if(curSents[i])speak(curSents[i].es);}

/* ================== 測驗 ================== */
let Q={pool:[],i:0,ok:[],ng:[],round:1,retry:false,locked:false};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function openQuiz(){Q.round=1;document.getElementById('quizOverlay').classList.add('show');newQuiz();}
function closeQuiz(){document.getElementById('quizOverlay').classList.remove('show');if(window.speechSynthesis)speechSynthesis.cancel();}
function newQuiz(){Q.round=1;beginRound(shuffle(filtered.length>=4?filtered:allWords).slice(0,20),false);}
function retryWrong(){if(!Q.ng.length)return;Q.round++;beginRound(Q.ng.slice(),true);}
function beginRound(pool,retry){
  Q.pool=pool;Q.i=0;Q.ok=[];Q.ng=[];Q.retry=retry;
  document.getElementById('quizQ').style.display='block';
  document.getElementById('quizR').style.display='none';
  showQ();
}
function showQ(){
  Q.locked=false;
  if(Q.i>=Q.pool.length){showResult();return;}
  const t=Q.pool[Q.i];
  document.getElementById('qRound').textContent=Q.retry?('🔁 重考第 '+Q.round+' 輪'):('第 '+Q.round+' 輪');
  document.getElementById('qProg').textContent=(Q.i+1)+' / '+Q.pool.length;
  document.getElementById('qBar').style.width=(Q.i/Q.pool.length*100)+'%';
  document.getElementById('qWord').textContent=t.word;
  document.getElementById('qRead').textContent=artPhrase(t);
  document.getElementById('qZh').textContent='諧音：'+toZh(t.word);
  document.getElementById('qScore').textContent='✅ '+Q.ok.length+'　❌ '+Q.ng.length;
  const wrongs=shuffle(allWords.filter(function(w){return w.id!==t.id&&firstZh(w.zh)!==firstZh(t.zh);})).slice(0,3);
  const opts=shuffle(wrongs.concat([t]));
  const box=document.getElementById('qOpts');
  box.innerHTML=opts.map(function(o){return '<button class="opt" data-id="'+o.id+'">'+o.zh+'</button>';}).join('');
  box.onclick=function(e){const b=e.target.closest('.opt');if(b)answer(b,parseInt(b.getAttribute('data-id'),10));};
  setTimeout(function(){speakId(t.id);},300);
}
function answer(btn,id){
  if(Q.locked)return;Q.locked=true;
  const t=Q.pool[Q.i];
  const good=(id===t.id);
  if(good){btn.classList.add('correct');Q.ok.push(t);}
  else{
    btn.classList.add('wrong');Q.ng.push(t);
    document.querySelectorAll('#qOpts .opt').forEach(function(b){if(parseInt(b.getAttribute('data-id'),10)===t.id)b.classList.add('correct');});
  }
  speakId(t.id);
  document.getElementById('qScore').textContent='✅ '+Q.ok.length+'　❌ '+Q.ng.length;
  document.getElementById('qBar').style.width=((Q.i+1)/Q.pool.length*100)+'%';
  Q.i++;
  setTimeout(showQ,good?1100:1900);
}
function quizSpeak(){const t=Q.pool[Q.i];if(t)speakId(t.id);}
function showResult(){
  document.getElementById('quizQ').style.display='none';
  document.getElementById('quizR').style.display='block';
  const n=Q.pool.length,ok=Q.ok.length,ng=Q.ng.length,pct=n?Math.round(ok/n*100):0;
  document.getElementById('rEmoji').textContent=pct===100?'🏆':pct>=80?'🎉':pct>=60?'👍':pct>=40?'📖':'💪';
  document.getElementById('rTitle').textContent=pct===100?'完美！':pct>=80?'非常好！':pct>=60?'不錯喔！':pct>=40?'繼續努力！':'加油！';
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNg').textContent=ng;
  document.getElementById('rPct').textContent=pct+'%';
  const wl=document.getElementById('rWrong');
  if(ng){
    wl.innerHTML='<div style="font-size:.72rem;color:var(--muted);margin-bottom:6px">❌ 答錯的單字</div>'+Q.ng.map(function(w){return '<div class="wrongrow"><b>'+w.word+'</b><span style="color:var(--muted)">'+firstZh(w.zh)+'</span><span style="cursor:pointer" onclick="speakId('+w.id+')">🔊</span></div>';}).join('');
    document.getElementById('rRetry').style.display='block';
  }else{
    wl.innerHTML='<div style="text-align:center;color:var(--green);padding:10px">🎊 沒有答錯的單字！</div>';
    document.getElementById('rRetry').style.display='none';
  }
}

/* ================== 啟動 ================== */
document.getElementById('search').addEventListener('input',applyFilters);
document.getElementById('posFilter').addEventListener('change',applyFilters);
document.getElementById('levelFilter').addEventListener('change',applyFilters);
buildCats();
renderList();

</script>
</body>
</html>
